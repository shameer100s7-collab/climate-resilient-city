<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Climate-Resilient City — Official Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root {
    --bg: #0b1220; --panel: #131c30; --border: #22314f;
    --text: #e8edf7; --muted: #93a2c2;
    --red: #e5484d; --orange: #f5a524; --yellow: #f4d03f; --green: #2ecc71;
    --accent: #4f7cff;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1 { font-size: 18px; margin: 0; }
  header .tabs { display:flex; gap:8px; }
  header .tabs button { background: var(--panel); border:1px solid var(--border); color:var(--muted); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
  header .tabs button.active { color:#fff; border-color:var(--accent); background:#182544; }
  header a.switch-link { color: var(--muted); font-size: 13px; text-decoration:none; border:1px solid var(--border); padding:6px 12px; border-radius:8px; }
  header a.switch-link:hover { color:#fff; border-color: var(--accent); }
  .layout { display:flex; height: calc(100vh - 61px); flex-wrap: wrap; }
  #map { flex: 1 1 55%; min-height: 300px; }
  .sidebar { width: 400px; flex: 1 1 400px; border-left: 1px solid var(--border); overflow-y:auto; padding:16px; }
  .zone-card { background: var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; cursor:pointer; }
  .zone-card:hover { border-color:var(--accent); }
  .zone-card h3 { margin:0 0 8px 0; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; color:#0b1220; }
  .badge.RED{background:var(--red); color:#fff;} .badge.ORANGE{background:var(--orange);}
  .badge.YELLOW{background:var(--yellow);} .badge.GREEN{background:var(--green);}
  .row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:4px; }
  .detail { padding:6px 0; font-size:13px; color: var(--muted); }
  .imd-box { margin-top:6px; padding:8px 10px; border-radius:8px; background:#0e1729; border:1px solid var(--border); font-size:12px; color:var(--muted); }
  .imd-box.live { border-color:#2ecc71; color:#bfead0; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  button.action-btn { flex:1; padding:9px 6px; border-radius:8px; border:1px solid var(--border); background:#1c2a4a; color:#fff; cursor:pointer; font-size:12.5px; }
  button.action-btn:hover:not(:disabled) { background:#25396b; }
  button.action-btn:disabled { opacity:0.4; cursor:not-allowed; background:#111b30; }
  button.action-btn.message { border-color:#f4d03f; }
  .preventive { margin-top:10px; padding:10px; border-radius:8px; background:#1c1420; border:1px solid #3a2230; }
  .preventive h4 { margin:0 0 6px 0; font-size:12px; color:#f0c8cf; text-transform:uppercase; letter-spacing:0.03em; }
  .preventive ul { margin:0; padding-left:18px; font-size:12.5px; color:#e8d5da; }
  .preventive.calm { background:#0f2418; border-color:#1c3d28; }
  .preventive.calm h4 { color:#a9e6c4; }
  .preventive.calm ul { color:#cdeedb; }
  .subscribers { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .loading { color: var(--muted); font-size: 13px; padding: 12px; }
  #status { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>🏛️ Climate-Resilient City — Official Dashboard</h1>
    <div id="status">Loading live data…</div>
  </div>
  <div class="tabs">
    <button class="active" data-mode="flood">Flood</button>
    <button data-mode="heat">Heat</button>
    <button data-mode="water">Water Shortage</button>
  </div>
  <a class="switch-link" href="citizen.html">Resident view →</a>
</header>
<div class="layout">
  <div id="map"></div>
  <div class="sidebar" id="sidebar"><div class="loading">Fetching zones…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API_BASE = "";
let mode = "flood";
let zonesData = [];
let markers = {};

const map = L.map('map').setView([10.9, 78.6], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

function levelColor(level) {
  return {RED:"#e5484d", ORANGE:"#f5a524", YELLOW:"#f4d03f", GREEN:"#2ecc71"}[level] || "#93a2c2";
}

// Suggested preventive measures for officials, by hazard + severity. This is
// operational guidance to prompt action, not a substitute for the city's own
// disaster-management SOPs.
const PREVENTIVE = {
  flood: {
    YELLOW: ["Alert drainage/PWD crews to inspect known choke points", "Pre-position pumps near low-lying zones"],
    ORANGE: ["Deploy pumps and clear blocked drains in high-risk areas", "Coordinate with disaster response teams on standby", "Notify hospitals/shelters to prepare"],
    RED: ["Activate emergency response teams and open relief shelters", "Coordinate evacuation of low-lying/high-risk pockets", "Issue public advisory via all channels; escalate to district disaster authority"],
  },
  heat: {
    YELLOW: ["Ensure public drinking-water points are functional", "Brief field staff on heat-safety protocol"],
    ORANGE: ["Open cooling shelters / shaded rest points", "Adjust outdoor worker shift timings (avoid 12–4pm)"],
    RED: ["Declare heat-wave advisory; restrict non-essential outdoor work", "Increase ambulance/health-post readiness for heat-illness cases"],
  },
  water: {
    YELLOW: ["Review reservoir/groundwater levels with the water board", "Flag zone for tanker-supply contingency planning"],
    ORANGE: ["Schedule tanker supply for at-risk wards", "Restrict non-essential municipal water usage"],
    RED: ["Activate emergency tanker distribution", "Coordinate rationing schedule and public communication"],
  },
};

function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  zonesData.forEach(z => {
    const hazard = z[mode];
    const level = hazard.alert_level || "GREEN";
    const marker = L.circleMarker([z.lat, z.lon], {
      radius: 14, color: levelColor(level), fillColor: levelColor(level), fillOpacity: 0.7, weight: 2
    }).addTo(map);
    marker.bindPopup(`<b>${z.name}</b><br>${mode.toUpperCase()} risk: ${level}`);
    marker.on('click', () => focusZone(z.id));
    markers[z.id] = marker;
  });
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = "";
  zonesData.forEach(z => {
    const hazard = z[mode];
    const level = hazard.alert_level || "GREEN";
    const card = document.createElement('div');
    card.className = "zone-card";
    card.id = "card-" + z.id;

    let detailHtml = "";
    if (mode === "flood") {
      detailHtml = `
        <div class="detail">Risk score: ${hazard.risk_score} (${hazard.model_mode})</div>
        <div class="detail">Detection confidence: ${hazard.confidence}</div>`;
      if (hazard.alert_level_source) {
        detailHtml += `<div class="detail">⚠️ ${hazard.alert_level_source}</div>`;
      }
    } else if (mode === "heat") {
      detailHtml = hazard.ok ? `
        <div class="detail">Temp: ${hazard.current_temp_c}°C · Humidity: ${hazard.humidity_pct}%</div>
        <div class="detail">Heat index (feels like): ${hazard.heat_index_c}°C</div>` :
        `<div class="detail">Weather unavailable: ${hazard.error}</div>`;
    } else {
      detailHtml = hazard.ok ? `
        <div class="detail">Forecast rain (24h): ${hazard.forecast_rain_next_24h_mm} mm</div>
        <div class="detail">Shortage risk score: ${hazard.shortage_risk_score}</div>` :
        `<div class="detail">Weather unavailable: ${hazard.error}</div>`;
    }

    // IMD live warning panel (flood tab only carries fused district warning today)
    let imdHtml = "";
    if (z.imd_warning) {
      if (z.imd_warning.ok) {
        imdHtml = `<div class="imd-box live">📡 IMD live: ${z.imd_warning.day1_warning_text || "warning issued"} (${z.imd_warning.day1_level})</div>`;
      } else {
        imdHtml = `<div class="imd-box">IMD live data: ${z.imd_warning.error}</div>`;
      }
    }

    const callDisabled = level === "GREEN";
    const showMessage = level === "YELLOW" || level === "ORANGE" || level === "RED";

    const measures = (PREVENTIVE[mode] && PREVENTIVE[mode][level]) || null;
    let preventiveHtml = "";
    if (measures) {
      preventiveHtml = `
        <div class="preventive">
          <h4>Suggested preventive measures</h4>
          <ul>${measures.map(m => `<li>${m}</li>`).join("")}</ul>
        </div>`;
    } else {
      preventiveHtml = `<div class="preventive calm"><h4>Status</h4><ul><li>No action needed — monitor as usual.</li></ul></div>`;
    }

    card.innerHTML = `
      <h3>${z.name} <span class="badge ${level}">${level}</span></h3>
      ${detailHtml}
      ${imdHtml}
      <div class="actions">
        <button class="action-btn call" ${callDisabled ? "disabled" : ""} onclick="triggerAlert('${z.id}', event)" title="${callDisabled ? 'Disabled — alert level is Green' : 'Call every registered number for this zone'}">📞 ${callDisabled ? "No call needed (Green)" : "Call zone"}</button>
        ${showMessage ? `<button class="action-btn message" onclick="triggerMessage('${z.id}', event)">💬 Send SMS</button>` : ""}
      </div>
      <div class="subscribers">${z.subscriber_count || 0} resident(s) subscribed to SMS alerts for this zone</div>
      ${preventiveHtml}
    `;
    card.onclick = (e) => { if (e.target.tagName !== 'BUTTON') focusZone(z.id); };
    sidebar.appendChild(card);
  });
}

function focusZone(id) {
  const z = zonesData.find(z => z.id === id);
  if (z) map.setView([z.lat, z.lon], 14);
  const el = document.getElementById("card-" + id);
  if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
}

async function triggerAlert(zoneId, event) {
  event.stopPropagation();
  const btn = event.target;
  btn.textContent = "Calling…";
  try {
    const resp = await fetch(`${API_BASE}/api/alerts/trigger?zone_id=${zoneId}&hazard_type=${mode}`, {method:"POST"});
    const data = await resp.json();
    if (data.ok) {
      btn.textContent = data.calls.length ? `✅ Call(s) triggered (${data.alert_level})` : `Level is ${data.alert_level} — no call needed`;
    } else {
      btn.textContent = "❌ " + (data.error || "failed");
    }
  } catch (e) {
    btn.textContent = "❌ Error contacting backend";
  }
}

async function triggerMessage(zoneId, event) {
  event.stopPropagation();
  const btn = event.target;
  btn.textContent = "Sending…";
  try {
    const resp = await fetch(`${API_BASE}/api/alerts/message?zone_id=${zoneId}&hazard_type=${mode}`, {method:"POST"});
    const data = await resp.json();
    if (data.ok) {
      btn.textContent = data.messages.length ? `✅ SMS sent (${data.alert_level})` : `Level is ${data.alert_level} — no SMS needed`;
    } else {
      btn.textContent = "❌ " + (data.error || "failed");
    }
  } catch (e) {
    btn.textContent = "❌ Error contacting backend";
  }
}

async function loadZones() {
  document.getElementById('status').textContent = "Loading live data…";
  try {
    const resp = await fetch(`${API_BASE}/api/zones`);
    const data = await resp.json();
    zonesData = data.zones;
    renderMarkers();
    renderSidebar();
    document.getElementById('status').textContent = "Live — updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status').textContent = "Could not reach backend — is it running?";
  }
}

document.querySelectorAll('header .tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('header .tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    renderMarkers();
    renderSidebar();
  });
});

loadZones();
setInterval(loadZones, 60000);
</script>
</body>
</html>
